name: Daily job refresh

on:
  schedule:
    # Start shortly before 08:30 so the published page is normally ready by 08:30.
    - cron: "23 8 * * *"
      timezone: "Asia/Shanghai"
    # Backup run: exits without fetching if the primary run already refreshed today.
    - cron: "7 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-job-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify and discover jobs (scheduled)
        if: github.event_name == 'schedule'
        run: python scripts/update_jobs.py --timeout 12 --workers 8 --skip-if-updated-today

      - name: Verify and discover jobs (manual)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/update_jobs.py --timeout 12 --workers 8

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/jobs.js data/jobs.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "solid-mechanics-job-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.js data/jobs.json
          git commit -m "data: daily job refresh"
          git push
